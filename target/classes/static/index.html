<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Grain Silo Hub</title><link rel="stylesheet" href="style.css"></head><body><header><h1>🌾 Grain Silo Operations Hub</h1><p>Autonomous Aeration & Quality Optimization</p></header><main><div class="cards"><div><b id="silos">0</b><span>Silo Units</span></div><div><b id="invoices">0</b><span>Customer Invoices</span></div><div><b id="bills">0</b><span>Vendor Bills</span></div></div><section><h2>Create Silo</h2><input id="name" placeholder="Silo Cluster B"><input id="location" placeholder="Location"><input id="humidity" type="number" placeholder="Humidity threshold"><button onclick="createSilo()">Create</button></section><section><h2>Telemetry</h2><input id="siloId" type="number" placeholder="Silo ID"><input id="hval" type="number" placeholder="Humidity %"><input id="tval" type="number" placeholder="Temperature °C"><button onclick="sendTelemetry()">Ingest</button><p id="result"></p></section><section><h2>P&L</h2><button onclick="pnl()">View P&L</button><pre id="report"></pre></section></main><script src="app.js"></script></body></html>
